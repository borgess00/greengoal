# Deploy no Netlify a partir do GitHub (não use "arrastar arquivos":
# o site precisa do build e das funções de servidor).
[build]
  command = "npm run build"
  publish = "dist/client"
  # Economiza créditos: não publica quando só mudaram documentação, testes
  # ou a automação do GitHub (scripts/, .github/, e2e/, supabase/, *.md).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public package.json package-lock.json vite.config.ts tsconfig.json netlify.toml server.mjs"

[build.environment]
  NODE_VERSION = "22"
